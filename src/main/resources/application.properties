spring.application.name=scheduler
spring.jpa.open-in-view=false
# db/seed holds demo data, loaded only with the demo profile (application-demo.properties).
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
# A replay waits for the winning transaction; give up instead of holding the connection forever.
# lock_timeout stays well above PostgreSQL's 1 s deadlock_timeout, so deadlocks are still found.
# statement_timeout: ten requests racing for one slot were measured at up to ~20 s per statement.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'; SET statement_timeout = '30s'
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
# Ids must be JSON integers: no "1" and no 1.0 or 1.5.
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
# JSON log lines (ECS). The request id from RequestIdFilter is in the MDC as requestId.
logging.structured.format.console=ecs
management.endpoints.web.exposure.include=health,metrics
# Show db UP or DOWN, never connection details.
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
# Error responses are documented by OpenApiConfig, not guessed from ApiExceptionHandler.
springdoc.override-with-generic-response=false
# Swagger UI: no spec or config from ?url= / ?configUrl=, no default demo spec, no external validator.
springdoc.swagger-ui.query-config-enabled=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.validator-url=
